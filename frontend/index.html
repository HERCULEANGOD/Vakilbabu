<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Babu | VakilBabu</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="chat-panel">
        <header class="chat-header">
          <div>
            <p class="eyebrow">VakilBabu</p>
            <h1>Babu</h1>
          </div>
          <button
            id="guideToggle"
            class="guide-toggle"
            type="button"
            aria-expanded="false"
            aria-controls="questionGuide"
          >
            What can I ask?
          </button>
        </header>

        <section id="questionGuide" class="question-guide" aria-label="Frequently asked questions" hidden>
          <div class="guide-heading">
            <h2>Explore questions</h2>
          </div>
          <div id="faqTopics" class="faq-topics" aria-live="polite"></div>
        </section>

        <div id="chatMessages" class="chat-messages" aria-live="polite"></div>

        <form id="chatForm" class="chat-form">
          <label class="sr-only" for="messageInput">Type your message</label>
          <input
            id="messageInput"
            type="text"
            placeholder="Ask about the app or workspace..."
            autocomplete="off"
          />
          <button type="submit">Send</button>
        </form>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
